function buildGoogleMapsPlaceUrl(lat, lng) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${lat},${lng}`)}`;
}

function buildGoogleMapsDirectionsUrl(stops, originCoords = null) {
  if (!stops || stops.length === 0) return 'https://www.google.com/maps';
  const points = originCoords ? [originCoords, ...stops] : [...stops];
  if (points.length === 1) {
    return `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${encodeURIComponent(`${points[0].lat},${points[0].lng}`)}`;
  }
  const origin = `${points[0].lat},${points[0].lng}`;
  const destination = `${points[points.length - 1].lat},${points[points.length - 1].lng}`;
  const middle = points.slice(1, -1).slice(0, 20).map(p => `${p.lat},${p.lng}`).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}`;
  if (middle) url += `&waypoints=${encodeURIComponent(middle)}`;
  return url;
}

function haversine(a, b) {
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

function statusKey(c, sensors, thresholds = { critical: 90, full: 75 }) {
  const s = sensors.find(x => x.id === c.sensorId);
  if (!s || s.status === 'avariado') return 'sensor_broken';
  if (s.connectivity === 'offline') return 'sensor_offline';
  if (c.fillLevel >= thresholds.critical) return 'critical';
  if (c.fillLevel >= thresholds.full) return 'full';
  if (c.fillLevel >= 50) return 'attention';
  return 'available';
}

function optimizeRoute(containers, sensors, vehicle, targetProvince = 'all') {
  const priority = containers.filter(c => {
    if (targetProvince !== 'all' && c.province !== targetProvince) return false;
    const k = statusKey(c, sensors);
    return (k === 'full' || k === 'critical' || k === 'attention') && c.fillLevel >= 50;
  }).sort((a, b) => b.fillLevel - a.fillLevel);

  const limit = vehicle.capacityStops || 14;
  const remaining = priority.slice(0, Math.max(limit, 1));
  const ordered = [];
  let cur = { lat: vehicle.lat, lng: vehicle.lng };

  while (remaining.length) {
    let bi = 0, bd = Infinity, bestDist = 0;
    remaining.forEach((c, i) => {
      const dist = haversine(cur, c);
      const urgencyWeight = c.fillLevel >= 90 ? 0.6 : c.fillLevel >= 75 ? 0.85 : 1.0;
      const score = dist * urgencyWeight;
      if (score < bd) { bd = score; bestDist = dist; bi = i; }
    });
    const next = remaining.splice(bi, 1)[0];
    ordered.push({ ...next, distFromPrev: +bestDist.toFixed(2) });
    cur = next;
  }
  return ordered;
}

const ToastCtx = React.createContext(null);
const useToast = () => React.useContext(ToastCtx);

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const show = useCallback((msg, type = 'info', duration = 3500) => {
    const id = uid('TOAST');
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), duration);
  }, []);
  const iconMap = { success: 'check', error: 'alert', warn: 'alert', info: 'info' };
  const colors  = { success: 'bg-savanna-600', error: 'bg-terra-600', warn: 'bg-ochre-600', info: 'bg-obsidian-900' };

  return (
    <ToastCtx.Provider value={show}>
      {children}
      <div className="fixed bottom-4 right-4 z-[3000] space-y-2 pointer-events-none max-w-sm">
        {toasts.map(t => (
          <div key={t.id} className={`pointer-events-auto rounded-xl shadow-2xl px-4 py-3 text-sm text-white flex items-center gap-2.5 animate-slide-in border border-white/10 ${colors[t.type] || colors.info}`}>
            <Icon name={iconMap[t.type] || 'info'} className="w-4 h-4 text-white" />
            <span className="flex-1">{t.msg}</span>
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}

function useCountUp(target, duration = 600) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    let raf;
    const start = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setVal(Math.round(target * eased));
      if (t < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return val;
}

function AnimatedKPI({ value, suffix = '' }) {
  const v = useCountUp(typeof value === 'number' ? value : 0);
  return <span className="tabular-nums">{v.toLocaleString('pt-PT')}{suffix}</span>;
}

function Sparkline({ points = [18, 22, 20, 26, 24, 28, 31], color = '#0f766e' }) {
  const max = Math.max(...points, 1);
  const min = Math.min(...points, 0);
  const span = Math.max(1, max - min);
  const coords = points.map((p, i) => {
    const x = (i / Math.max(1, points.length - 1)) * 76 + 2;
    const y = 26 - ((p - min) / span) * 20;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return (
    <svg width="80" height="30" viewBox="0 0 80 30" className="overflow-visible">
      <polyline fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" points={coords} />
    </svg>
  );
}

function matchesMapFilters(c, sensors, filters, thresholds) {
  if (filters.status && filters.status !== 'all' && statusKey(c, sensors, thresholds) !== filters.status) return false;
  if (filters.province && filters.province !== 'all' && c.province !== filters.province) return false;
  if (filters.municipality && filters.municipality !== 'all' && c.municipality !== filters.municipality) return false;
  if (filters.street && filters.street !== 'all' && c.street !== filters.street) return false;
  return true;
}

function MapView({
  containers, sensors, vehicles = [], route, filters = {}, selectedId, onSelect,
  showVehicles = true, height = '620px', pulseCritical = true, autoFit = true,
  defaultLayer = 'roadmap', compact = false, overlayTopLeft = null, overlayRight = null,
  thresholds = { critical: 90, full: 75 }
}) {
  const el = useRef(null);
  const map = useRef(null);
  const tileLayerRef = useRef(null);
  const layer = useRef(null);
  const lastFitKey = useRef('');
  const [mapType, setMapType] = useState(defaultLayer);

  useEffect(() => {
    if (!el.current || map.current || typeof L === 'undefined') return;
    map.current = L.map(el.current, { zoomControl: false }).setView([-8.9024, 13.3728], 12);
    L.control.zoom({ position: 'bottomright' }).addTo(map.current);
    layer.current = L.layerGroup().addTo(map.current);

    let ro;
    if (typeof ResizeObserver !== 'undefined') {
      ro = new ResizeObserver(() => { if (map.current) map.current.invalidateSize(); });
      ro.observe(el.current);
    }
    const t = setTimeout(() => { if (map.current) map.current.invalidateSize(); }, 200);
    return () => {
      clearTimeout(t);
      if (ro) ro.disconnect();
      if (map.current) { map.current.remove(); map.current = null; }
    };
  }, []);

  useEffect(() => {
    if (!map.current || typeof L === 'undefined') return;
    if (tileLayerRef.current) { map.current.removeLayer(tileLayerRef.current); tileLayerRef.current = null; }

    if (mapType === 'satellite') {
      tileLayerRef.current = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 19, attribution: '© Esri Satélite' }
      ).addTo(map.current);
    } else {
      let switchedToOsm = false;
      const cleanStreets = L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
        { subdomains: 'abcd', maxZoom: 19, attribution: '© CartoDB · © OSM' }
      );
      cleanStreets.on('tileerror', () => {
        if (!switchedToOsm && map.current) {
          switchedToOsm = true;
          map.current.removeLayer(cleanStreets);
          tileLayerRef.current = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '© OpenStreetMap'
          }).addTo(map.current);
        }
      });
      tileLayerRef.current = cleanStreets.addTo(map.current);
    }
  }, [mapType]);

  useEffect(() => {
    if (!map.current || !layer.current) return;
    setTimeout(() => map.current && map.current.invalidateSize(), 80);
    layer.current.clearLayers();
    const visibleCoords = [];

    containers.forEach(c => {
      if (!matchesMapFilters(c, sensors, filters, thresholds)) return;
      visibleCoords.push([c.lat, c.lng]);
      const k = statusKey(c, sensors, thresholds);
      const isCritical = k === 'critical';
      const isSel = selectedId === c.id;
      const bg = STATUS[k].color;

      const pinHtml = `<div class="${(pulseCritical && isCritical) ? 'pulse-pin' : ''}" style="background:${bg};color:#fff;font-weight:800;font-size:10px;padding:2.5px 8px;border-radius:999px;border:${isSel ? '2.5px solid #1c1917' : '2px solid #ffffff'};box-shadow:0 2px 6px rgba(0,0,0,0.32);white-space:nowrap;transform:${isSel ? 'scale(1.16)' : 'scale(1)'}">${c.fillLevel}%</div>`;
      const m = L.marker([c.lat, c.lng], {
        icon: L.divIcon({ html: pinHtml, className: '', iconSize: [42, 22], iconAnchor: [21, 11] })
      });
      m.bindPopup(`<b>${c.code}</b> · <b>${c.fillLevel}%</b><br/>${c.street}`);
      m.on('click', () => onSelect && onSelect(c.id));
      layer.current.addLayer(m);
    });

    if (showVehicles) {
      vehicles.forEach(v => {
        const bg = v.status === 'maintenance' ? '#c2410c' : '#1c1917';
        const html = `<div style="background:${bg};color:#fbbf24;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:2px solid #fbbf24;box-shadow:0 2px 6px rgba(0,0,0,.35)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="15" height="12" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
          </svg>
        </div>`;
        L.marker([v.lat, v.lng], { icon: L.divIcon({ html, className: '', iconSize: [28, 28], iconAnchor: [14, 14] }) })
          .bindPopup(`<b>${v.plate}</b> · ${v.type}`).addTo(layer.current);
      });
    }

    if (route && route.stops && route.stops.length) {
      const stopCoords = route.stops.map(s => [s.lat, s.lng]);
      L.polyline(stopCoords, { color: '#0f766e', weight: 4, dashArray: '8 6' }).addTo(layer.current);
      route.stops.forEach((s, i) => {
        const html = `<div style="background:${s.done ? '#0f766e' : '#d97706'};color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid #fff;font-weight:bold;box-shadow:0 2px 4px rgba(0,0,0,.3)">${s.done ? '✓' : i + 1}</div>`;
        L.marker([s.lat, s.lng], { icon: L.divIcon({ html, className: '', iconSize: [24, 24], iconAnchor: [12, 12] }) })
          .bindPopup(`<b>${i + 1}. ${s.code}</b> (${s.fillLevel}%)<br/>${s.street}`).addTo(layer.current);
      });
      if (autoFit && stopCoords.length) {
        const rKey = 'route-' + route.stops.map(s => s.id).join(',');
        if (lastFitKey.current !== rKey) {
          lastFitKey.current = rKey;
          try { map.current.fitBounds(L.latLngBounds(stopCoords), { padding: [45, 45], maxZoom: 14 }); } catch (e) {}
        }
      }
    } else if (autoFit && visibleCoords.length && !selectedId) {
      const fKey = `${filters.province || 'all'}-${filters.municipality || 'all'}-${filters.street || 'all'}-${filters.status || 'all'}`;
      if (lastFitKey.current !== fKey) {
        lastFitKey.current = fKey;
        try {
          if (visibleCoords.length === 1) {
            map.current.setView(visibleCoords[0], 16);
          } else if (filters.province && filters.province !== 'all') {
            map.current.fitBounds(L.latLngBounds(visibleCoords), { padding: [45, 45], maxZoom: 14 });
          } else {
            map.current.setView([-10.5, 14.5], 6);
          }
        } catch (e) {}
      }
    }
  }, [containers, sensors, vehicles, route, filters, selectedId, showVehicles, onSelect, pulseCritical, autoFit, thresholds]);

  useEffect(() => {
    if (!map.current || !selectedId) return;
    const c = containers.find(x => x.id === selectedId);
    if (c) map.current.flyTo([c.lat, c.lng], 15, { duration: 0.55 });
  }, [selectedId, containers]);

  return (
    <div className="relative overflow-hidden rounded-xl">
      {overlayTopLeft}
      {overlayRight}

      <div className="absolute top-3 right-3 z-[450] flex items-center gap-1 bg-white/90 backdrop-blur-md border border-sand-200 rounded-lg p-1 shadow-md">
        {[
          { id: 'roadmap',   label: 'Ruas',     icon: 'road' },
          { id: 'satellite', label: 'Satélite', icon: 'satellite' },
        ].map(opt => (
          <button
            key={opt.id}
            type="button"
            onClick={() => setMapType(opt.id)}
            className={`px-2.5 py-1 rounded-md text-[11px] font-bold inline-flex items-center gap-1 transition ${
              mapType === opt.id ? 'bg-obsidian-900 text-ochre-400 shadow-sm' : 'text-obsidian-900 hover:bg-sand-100'
            }`}
          >
            <Icon name={opt.icon} className="w-3 h-3" />
            <span>{opt.label}</span>
          </button>
        ))}
      </div>

      <div ref={el} style={{ height }} className="w-full rounded-xl z-0" />

      {!compact && (
        <div className="absolute bottom-3 left-3 z-[400] bg-white/90 backdrop-blur-md border border-sand-200 rounded-lg px-2.5 py-1 text-[11px] shadow flex flex-wrap gap-x-2.5 gap-y-1">
          <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-[#0f766e]" />Disponível</span>
          <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-[#d97706]" />Atenção</span>
          <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-[#ea580c]" />Cheio</span>
          <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-[#c2410c]" />Crítico (≥90%)</span>
          <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-[#78716c]" />Offline</span>
        </div>
      )}
    </div>
  );
}

/* ============================================================================
 * 8. MÓDULO 1 — DASHBOARD EXECUTIVO (COPILOTO IA COMPACTO + 4 HERO KPIS)
 * ========================================================================== */

function OperationalCopilotBar({ data, setData, logAction, go }) {
  const toast = useToast();
  const [prompt, setPrompt] = useState('');
  const [response, setResponse] = useState(null);

  const suggestions = [
    'Previsão em Viana antes das 18h',
    'Frota disponível em Luanda',
    'Risco de incêndio / sensores críticos',
  ];

  const runAnalysis = (rawQuery) => {
    const q = (rawQuery || prompt).trim();
    if (!q) return;
    setPrompt(q);
    const lower = q.toLowerCase();

    const matchedProv = PROVINCES.find(p => lower.includes(p.toLowerCase()));
    const matchedMun = [...new Set(data.containers.map(c => c.municipality))].find(m => lower.includes(m.toLowerCase()));

    let pool = data.containers;
    let scopeLabel = 'Rede Nacional (Angola)';
    if (matchedMun) {
      pool = pool.filter(c => c.municipality.toLowerCase() === matchedMun.toLowerCase());
      scopeLabel = `Município de ${matchedMun}`;
    } else if (matchedProv) {
      pool = pool.filter(c => c.province.toLowerCase() === matchedProv.toLowerCase());
      scopeLabel = `Província de ${matchedProv}`;
    }

    const risky = pool
      .map(c => {
        const rate = c.fillLevel >= 85 ? 6.8 : c.fillLevel >= 65 ? 5.2 : 3.5;
        const hoursToFull = Math.max(1, Math.round((100 - c.fillLevel) / rate));
        return { ...c, rate, hoursToFull };
      })
      .filter(c => c.fillLevel >= 65)
      .sort((a, b) => b.fillLevel - a.fillLevel)
      .slice(0, 4);

    const targetProv = matchedProv || risky[0]?.province || 'Luanda';
    const availVehicles = data.vehicles.filter(v => v.status === 'available');
    const recommendedVehicle = availVehicles[0] || data.vehicles[0];

    let headline = `Análise Preditiva Kiela IA — ${scopeLabel}`;
    let summary = `${risky.length} ponto(s) com risco elevado de saturação antes das 18h.`;
    if (lower.includes('frota') || lower.includes('viatura')) {
      headline = 'Disponibilidade Operacional de Frota';
      summary = `${availVehicles.length} viatura(s) pronta(s) na base (${availVehicles.map(v => v.plate).join(', ') || 'nenhuma livre'}).`;
    } else if (lower.includes('incêndio') || lower.includes('sensor')) {
      const hot = data.sensors.filter(s => s.temperatureC >= 40);
      headline = 'Telemetria Térmica & Segurança IoT';
      summary = `${hot.length} sensor(es) com anomalia térmica detetada (ex.: Zango 3 a 49°C).`;
    }

    setResponse({ headline, summary, risky, targetProv, recommendedVehicle });
  };

  const dispatchFromCopilot = () => {
    if (!response || !response.recommendedVehicle) return;
    const v = response.recommendedVehicle;
    const stops = optimizeRoute(data.containers, data.sensors, v, response.targetProv);
    if (!stops.length) {
      toast('Sem paragens ≥50% elegíveis nesta zona.', 'warn');
      return;
    }
    const totalKm = +stops.reduce((acc, s) => acc + (s.distFromPrev || 0), 0).toFixed(1);
    const route = {
      id: uid('RT'),
      vehicleId: v.id,
      vehiclePlate: v.plate,
      driverId: v.driverId,
      createdAt: nowIso(),
      approvedAt: nowIso(),
      status: 'approved',
      totalKm,
      stops: stops.map(s => ({ ...s, done: false })),
    };
    setData(d => ({
      ...d,
      routes: [route, ...d.routes],
      vehicles: d.vehicles.map(x => x.id === v.id ? { ...x, status: 'in_route' } : x),
    }));
    logAction('COPILOTO_ROTA', `${route.id} → ${v.plate} (${stops.length} paragens)`);
    toast(`Rota IA ${route.id} despachada para ${v.plate} (${totalKm} km)`, 'success');
    go('routes');
  };

  return (
    <Card className="p-3 border-l-4 border-l-ochre-500 animate-fade-up">
      <div className="flex flex-col lg:flex-row lg:items-center gap-2.5">
        <div className="flex items-center gap-2 flex-shrink-0">
          <div className="w-7 h-7 rounded-lg bg-amber-50 text-ochre-600 flex items-center justify-center">
            <Icon name="spark" className="w-4 h-4" />
          </div>
          <span className="text-xs font-extrabold text-obsidian-900 uppercase tracking-wide">Copiloto IA</span>
        </div>

        <div className="flex-1 flex gap-2">
          <Input
            className="!py-1.5"
            value={prompt}
            onChange={e => setPrompt(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') runAnalysis(prompt); }}
            placeholder="Pergunte sobre saturação em Viana, Belas, frota disponível ou alertas térmicos..."
          />
          <Btn variant="primary" className="!py-1.5 !px-3" onClick={() => runAnalysis(prompt)}>
            <Icon name="send" className="w-3.5 h-3.5" />
            <span>Analisar</span>
          </Btn>
        </div>

        <div className="flex flex-wrap gap-1.5">
          {suggestions.map((s, idx) => (
            <button
              key={idx}
              type="button"
              onClick={() => runAnalysis(s)}
              className="text-[11px] font-medium px-2.5 py-1 rounded-full bg-sand-100 hover:bg-obsidian-900 hover:text-ochre-400 text-obsidian-900 transition"
            >
              {s}
            </button>
          ))}
        </div>
      </div>

      {response && (
        <div className="mt-3 pt-3 border-t border-sand-200 space-y-2.5 animate-fade-up">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div>
              <p className="text-xs font-bold text-obsidian-900">{response.headline}</p>
              <p className="text-xs text-stone-600">{response.summary}</p>
            </div>
            <div className="flex items-center gap-2">
              {response.recommendedVehicle && (
                <Btn variant="savanna" className="!text-xs !py-1.5" onClick={dispatchFromCopilot}>
                  <Icon name="route" className="w-3.5 h-3.5" />
                  <span>Despachar Rota IA ({response.recommendedVehicle.plate})</span>
                </Btn>
              )}
              <button onClick={() => setResponse(null)} className="text-xs text-stone-500 hover:text-obsidian-900 px-2 py-1">Fechar</button>
            </div>
          </div>

          {response.risky.length > 0 && (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
              {response.risky.map(c => (
                <div key={c.id} className="bg-sand-50 border border-sand-200 rounded-lg p-2.5 text-xs tabular-nums">
                  <div className="flex justify-between font-bold text-obsidian-900">
                    <span>{c.code}</span>
                    <span className={c.fillLevel >= 90 ? 'text-terra-600' : 'text-ochre-600'}>{c.fillLevel}%</span>
                  </div>
                  <p className="text-[11px] text-stone-600 truncate mt-0.5">{c.street}</p>
                  <p className="text-[10px] font-semibold text-savanna-600 mt-1">
                    +{c.rate}%/h · 100% em ~{c.hoursToFull}h
                  </p>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </Card>
  );
}

  const statusData = Object.keys(STATUS).map(k => ({ name: STATUS[k].label, value: byStatus(k), key: k })).filter(d => d.value > 0);

        <HeroStatCard label={`Críticos (≥${thresholds.critical}%)`} value={byStatus('critical')} delta={`${byStatus('full')} em nível cheio`} positive={false} accent="terra" icon="alert" sparkPoints={[3, 4, 5, 4, 6, 5, byStatus('critical')]} />
        <HeroStatCard label="Poupança Combustível" value={Math.round(totalSavedKz / 1000)} suffix=" mil Kz" delta="-28% km rodados (30d)" accent="savanna" icon="coin" sparkPoints={[820, 940, 1050, 1180, 1290, 1380, Math.round(totalSavedKz / 1000)]} />
        <HeroStatCard label="Recolhas Auditadas" value={done} delta={`${avail}/${vehicles.length} viaturas livres`} accent="savanna" icon="check" sparkPoints={[10, 12, 14, 16, 18, 20, done]} />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <Card className="p-4 animate-fade-up">
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-bold text-obsidian-900 text-sm">Alertas Críticos &amp; Térmicos ({unread})</h3>
            {unread > 0 && <button onClick={onMarkAllAlertsRead} className="text-xs font-semibold text-ochre-600 hover:underline">Marcar lidos</button>}
          </div>
          <div className="divide-y divide-sand-100 max-h-[250px] overflow-auto">
            {alerts.slice(0, 7).map(a => (
              <div key={a.id} onClick={() => onInspectContainer && onInspectContainer(a.containerId)}
                className={`py-2.5 flex items-start gap-2.5 cursor-pointer hover:bg-sand-50 rounded-lg px-1.5 transition ${a.read ? 'opacity-60' : ''}`}>
                <span className={`w-2 h-2 mt-1.5 rounded-full flex-shrink-0 ${a.severity === 'high' ? 'bg-terra-600' : 'bg-ochre-500'}`} />
                <div className="flex-1 min-w-0">
                  <p className="text-xs font-medium text-obsidian-900 leading-snug">{a.message}</p>
                  <p className="text-[10px] text-stone-500 mt-0.5 tabular-nums">{fmtDate(a.timestamp)} · Clique para auditar</p>
                </div>

        <Card className="p-4 animate-fade-up">
          <h3 className="font-bold text-obsidian-900 text-sm mb-3">Distribuição por Estado</h3>

                <CartesianGrid strokeDasharray="3 3" stroke="#e7e5e4" />

                <YAxis tick={{ fontSize: 11 }} />

 * 9. MÓDULO 2 — MAPA INTELIGENTE PANORÂMICO (GAVETAS GLASSMORPHISM)

function MapModule({ data, selectContainer }) {
  const [prov, setProv] = useState('Luanda');
  const [mun, setMun] = useState('Viana');
  const [street, setStreet] = useState('all');
  const [status, setStatus] = useState('all');
  const [selectedId, setSelectedId] = useState('KL-0001');
  const [showVehicles, setShowVehicles] = useState(true);
  const thresholds = { critical: data.settings?.criticalThreshold || 90, full: data.settings?.fullThreshold || 75 };

  const provinces = useMemo(() => [...new Set(data.containers.map(c => c.province))], [data.containers]);
  const municipalities = useMemo(() => {
    const list = prov === 'all' ? data.containers : data.containers.filter(c => c.province === prov);
    return [...new Set(list.map(c => c.municipality))];
  }, [data.containers, prov]);

  const streets = useMemo(() => {
    let list = data.containers;
    if (prov !== 'all') list = list.filter(c => c.province === prov);
    if (mun !== 'all') list = list.filter(c => c.municipality === mun);
    return [...new Set(list.map(c => c.street))];
  }, [data.containers, prov, mun]);

  const filteredContainers = useMemo(() => {
    return data.containers.filter(c => matchesMapFilters(c, data.sensors, { province: prov, municipality: mun, street, status }, thresholds));
  }, [data.containers, data.sensors, prov, mun, street, status, thresholds]);

  const selectedContainer = useMemo(
    () => data.containers.find(c => c.id === selectedId) || filteredContainers[0] || null,
    [data.containers, selectedId, filteredContainers]
  );

  const selectedSensor = useMemo(
    () => selectedContainer ? data.sensors.find(s => s.id === selectedContainer.sensorId) : null,
    [selectedContainer, data.sensors]
  );

  const floatingFilters = (
    <div className="absolute top-3 left-3 z-[450] bg-white/92 backdrop-blur-md border border-sand-200 rounded-xl p-2.5 shadow-lg max-w-[calc(100%-190px)] flex flex-wrap items-center gap-2">
      <Select className="!py-1 !text-xs !w-auto min-w-[115px]" value={prov} onChange={e => { setProv(e.target.value); setMun('all'); setStreet('all'); setSelectedId(null); }}>
        <option value="all">Províncias ({provinces.length})</option>
        {provinces.map(p => <option key={p}>{p}</option>)}
      </Select>
      <Select className="!py-1 !text-xs !w-auto min-w-[115px]" value={mun} onChange={e => { setMun(e.target.value); setStreet('all'); setSelectedId(null); }}>
        <option value="all">Municípios ({municipalities.length})</option>
        {municipalities.map(m => <option key={m}>{m}</option>)}
      </Select>
      <Select className="!py-1 !text-xs !w-auto min-w-[175px]" value={street} onChange={e => {
        const val = e.target.value;
        setStreet(val);
        if (val !== 'all') {
          const hit = data.containers.find(c => c.street === val);
          if (hit) setSelectedId(hit.id);
        } else {
          setSelectedId(null);
        }
      }}>
        <option value="all">Todas as ruas ({streets.length})</option>
        {streets.map(s => <option key={s}>{s}</option>)}
      </Select>
      <Select className="!py-1 !text-xs !w-auto min-w-[115px]" value={status} onChange={e => { setStatus(e.target.value); setSelectedId(null); }}>
        <option value="all">Estado: Todos</option>
        {Object.entries(STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
      </Select>
      <label className="flex items-center gap-1.5 text-[11px] font-bold text-obsidian-900 px-1.5 cursor-pointer select-none">
        <input type="checkbox" checked={showVehicles} onChange={e => setShowVehicles(e.target.checked)} className="rounded" />
        <span>Frota</span>
      </label>
    </div>
  );

  const floatingDrawer = (
    <div className="hidden lg:flex flex-col absolute top-14 right-3 bottom-3 w-76 z-[440] bg-white/92 backdrop-blur-md border border-sand-200 rounded-xl shadow-xl p-3">
      <div className="flex items-center justify-between mb-2">
        <h3 className="font-bold text-obsidian-900 text-xs uppercase tracking-wider">Pontos Monitorizados</h3>
        <span className="text-[11px] bg-obsidian-900 text-ochre-400 px-2 py-0.5 rounded-full font-bold tabular-nums">{filteredContainers.length}</span>
      </div>

      <div className="space-y-1.5 overflow-y-auto flex-1 pr-1">
        {filteredContainers.map(c => {
          const st = statusKey(c, data.sensors, thresholds);
          const active = selectedContainer?.id === c.id;
          return (
            <button
              key={c.id}
              type="button"
              onClick={() => setSelectedId(c.id)}
              className={`w-full text-left p-2 rounded-lg border transition ${
                active ? 'border-ochre-500 bg-amber-50/80' : 'border-sand-200 bg-white/80 hover:bg-white'
              }`}
            >
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-extrabold text-obsidian-900 tabular-nums">{c.code}</span>
                <span className="text-[11px] font-extrabold tabular-nums" style={{ color: STATUS[st].color }}>{c.fillLevel}%</span>
              </div>
              <p className="text-xs font-semibold text-obsidian-800 truncate mt-0.5">{c.street}</p>
              <p className="text-[10px] text-stone-500">{c.municipality} · {c.province}</p>
            </button>
          );

      </div>

      {selectedContainer && (
        <div className="mt-2.5 pt-2.5 border-t border-sand-200 space-y-2">
          <div>
            <div className="flex items-center justify-between">
              <span className="font-extrabold text-xs text-obsidian-900">{selectedContainer.code}</span>
              <Badge status={statusKey(selectedContainer, data.sensors, thresholds)} />
            </div>
            <p className="text-xs font-semibold text-obsidian-800 mt-0.5">{selectedContainer.street}</p>
            <p className="text-[11px] text-stone-500">{selectedContainer.neighborhood}</p>
            {selectedSensor && (
              <div className="grid grid-cols-3 gap-1 mt-1.5 text-[10px] tabular-nums bg-sand-50 p-1.5 rounded-lg border border-sand-200">
                <div><span className="text-stone-400 block">Temp.</span><b className={selectedSensor.temperatureC >= 40 ? 'text-terra-600' : 'text-obsidian-900'}>{selectedSensor.temperatureC}°C</b></div>
                <div><span className="text-stone-400 block">Inclinação</span><b>{selectedSensor.tiltStatus}</b></div>
                <div><span className="text-stone-400 block">Bateria</span><b className="text-savanna-600">{selectedSensor.battery}%</b></div>
              </div>
            )}
          </div>
          <div className="grid grid-cols-2 gap-1.5">
            <a href={buildGoogleMapsDirectionsUrl([selectedContainer])} target="_blank" rel="noopener noreferrer"
              className="px-2 py-1.5 rounded-lg text-[11px] font-bold bg-obsidian-900 text-ochre-400 text-center hover:bg-obsidian-800">
              Navegar GPS
            </a>
            <button type="button" onClick={() => selectContainer(selectedContainer.id)}
              className="px-2 py-1.5 rounded-lg text-[11px] font-bold bg-savanna-600 text-white hover:bg-savanna-700">

            </button>

        </div>

  );

  return (
    <Card className="p-1.5">
      <MapView

}

/* ============================================================================
 * 10. MÓDULO 3 — ROTAS & DESPACHO (BARRAS DE PROGRESSO SEGMENTADAS)
 * ========================================================================== */

function RoutesModule({ data, setData, logAction }) {
  const toast = useToast();
  const availVehicles = data.vehicles.filter(v => v.status !== 'maintenance');
  const [vehicleId, setVehicleId] = useState(availVehicles[0]?.id || 'V-01');
  const [targetProv, setTargetProv] = useState('Luanda');
  const [draftStops, setDraftStops] = useState([]);

  const generatePlan = () => {
    const v = data.vehicles.find(x => x.id === vehicleId);
    if (!v) return;
    const stops = optimizeRoute(data.containers, data.sensors, v, targetProv);
    setDraftStops(stops);
    if (!stops.length) toast('Sem contentores ≥50% elegíveis nesta província.', 'warn');
    else toast(`Rota calculada com ${stops.length} paragens prioritárias`, 'info');
  };

  const dispatchPlan = () => {
    const v = data.vehicles.find(x => x.id === vehicleId);
    if (!v || !draftStops.length) return;
    const totalKm = +draftStops.reduce((acc, s) => acc + (s.distFromPrev || 0), 0).toFixed(1);
    const route = {
      id: uid('RT'),
      vehicleId: v.id,
      vehiclePlate: v.plate,
      driverId: v.driverId,
      createdAt: nowIso(),
      approvedAt: nowIso(),
      status: 'approved',
      totalKm,
      stops: draftStops.map(s => ({ ...s, done: false })),
    };
    setData(d => ({
      ...d,
      routes: [route, ...d.routes],
      vehicles: d.vehicles.map(x => x.id === v.id ? { ...x, status: 'in_route' } : x),
    }));
    logAction('DESPACHO_ROTA', `${route.id} → ${v.plate} (${totalKm} km)`);
    toast(`Rota ${route.id} enviada para o motorista (${v.plate})`, 'success');
    setDraftStops([]);
  };

  const activeRoute = data.routes.find(r => r.status === 'approved') || null;
  const mapRoute = draftStops.length ? { stops: draftStops } : activeRoute;
  const stopsList = mapRoute?.stops || [];
  const nextPendingIdx = stopsList.findIndex(s => !s.done);

  return (
    <div className="space-y-4">
      <Card className="p-4 grid grid-cols-1 sm:grid-cols-4 gap-3 items-end">
        <Field label="Viatura Operacional">
          <Select value={vehicleId} onChange={e => setVehicleId(e.target.value)}>
            {availVehicles.map(v => <option key={v.id} value={v.id}>{v.plate} — {v.type}</option>)}
          </Select>
        </Field>
        <Field label="Jurisdição / Província">
          <Select value={targetProv} onChange={e => setTargetProv(e.target.value)}>
            <option value="all">Todas as Províncias</option>
            {[...new Set(data.containers.map(c => c.province))].map(p => <option key={p}>{p}</option>)}
          </Select>
        </Field>
        <Btn variant="primary" onClick={generatePlan}>
          <Icon name="route" className="w-4 h-4" />
          <span>Optimizar Rota VRP</span>
        </Btn>
        <Btn variant="savanna" onClick={dispatchPlan} disabled={!draftStops.length}>
          <Icon name="send" className="w-4 h-4" />
          <span>Aprovar &amp; Despachar ({draftStops.length})</span>
        </Btn>
      </Card>

      {stopsList.length > 0 && (
        <Card className="p-3.5 tabular-nums">
          <div className="flex items-center justify-between text-xs mb-2">
            <span className="font-bold text-obsidian-900">Progresso Segmentado por Paragem</span>
            <span className="text-stone-500">{stopsList.filter(s => s.done).length} de {stopsList.length} concluídas</span>
          </div>
          <div className="grid gap-1.5" style={{ gridTemplateColumns: `repeat(${stopsList.length}, minmax(0, 1fr))` }}>
            {stopsList.map((s, idx) => (
              <div key={s.id + '-seg-' + idx} title={`${idx + 1}. ${s.code} (${s.fillLevel}%)`}
                className={`h-2.5 rounded-full transition-all ${
                  s.done ? 'bg-savanna-600' : idx === nextPendingIdx ? 'bg-ochre-500 animate-pulse' : 'bg-sand-200'
                }`}
              />
            ))}
          </div>
        </Card>
      )}

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <Card className="p-2 lg:col-span-2">
          <MapView containers={data.containers} sensors={data.sensors} vehicles={data.vehicles} route={mapRoute} height="430px" />
        </Card>
        <Card className="p-4 space-y-2.5 max-h-[450px] overflow-auto tabular-nums">
          <div className="flex items-center justify-between">
            <h3 className="font-bold text-obsidian-900 text-sm">
              {draftStops.length ? 'Plano Calculado' : activeRoute ? `Rota Activa (${activeRoute.id})` : 'Sequência de Paragens'}
            </h3>
            {stopsList.length > 0 && (
              <a href={buildGoogleMapsDirectionsUrl(stopsList)} target="_blank" rel="noopener noreferrer"
                className="text-xs font-bold text-ochre-600 hover:underline inline-flex items-center gap-1">
                <Icon name="compass" className="w-3.5 h-3.5" />
                <span>GPS</span>
              </a>
            )}
          </div>
          {stopsList.map((s, i) => (
            <div key={s.id + '-' + i} className={`border rounded-lg p-2.5 text-xs flex items-center justify-between ${s.done ? 'border-savanna-600/30 bg-teal-50/40' : 'border-sand-200'}`}>
              <div>
                <p className="font-bold text-obsidian-900">{i + 1}. {s.code} ({s.fillLevel}%)</p>
                <p className="text-stone-600">{s.street} · {s.municipality}</p>
              </div>
              <span className="font-bold text-ochre-600">{s.distFromPrev || 0} km</span>
            </div>
          ))}
          {stopsList.length === 0 && (
            <div className="text-center py-8 space-y-2">
              <p className="text-xs text-stone-500">Nenhuma rota gerada para esta selecção.</p>
              <Btn variant="primary" className="!text-xs" onClick={generatePlan}>Calcular Agora</Btn>
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

/* ============================================================================
 * 11. MÓDULO 4 — APP MOTORISTA (EXECUÇÃO & VALIDAÇÃO QR CODE)
 * ========================================================================== */

function DriverModule({ data, setData, updateContainer, addAlert, logAction }) {
  const toast = useToast();
  const route = data.routes.find(r => r.status === 'approved') || data.routes[0];
  const [qrValidatedMap, setQrValidatedMap] = useState({});

  if (!route) {
    return (
      <Card className="p-8 text-center space-y-3 max-w-lg mx-auto">
        <div className="w-12 h-12 rounded-2xl bg-amber-50 text-ochre-600 flex items-center justify-center mx-auto">
          <Icon name="truck" className="w-6 h-6" />
        </div>
        <h3 className="font-bold text-obsidian-900">Nenhuma ordem de serviço activa</h3>
        <p className="text-xs text-stone-500">Despache uma rota no módulo <b>Rotas &amp; Despacho</b> ou use o <b>Copiloto IA</b> no Dashboard.</p>
      </Card>
    );
  }

  const assignedVehicle = data.vehicles.find(v => v.id === route.vehicleId);

  const scanQrCode = (stopId, code) => {
    setQrValidatedMap(prev => ({ ...prev, [stopId]: true }));
    toast(`QR Code ${code} validado com sucesso!`, 'success');
  };

  const finishStop = (i) => {
    const stop = route.stops[i];
    if (!stop || stop.done) return;
    const liveContainer = data.containers.find(x => x.id === stop.id) || stop;
    const before = liveContainer.fillLevel;
    const after = Math.max(4, Math.round(before * 0.07));
    const hasQr = !!qrValidatedMap[stop.id];
    const collection = {
      id: uid('REC'),
      containerId: liveContainer.code,
      containerCode: liveContainer.code,
      vehicleId: route.vehicleId,
      vehiclePlate: route.vehiclePlate,
      driverId: route.driverId,
      municipality: liveContainer.municipality,
      province: liveContainer.province,
      destination: 'Aterro Sanitário dos Mulenvos',
      timestamp: nowIso(),
      beforeLevel: before,
      afterLevel: after,
      status: 'confirmed',
      km: Math.round(stop.distFromPrev || 5),
      cost: Math.round((stop.distFromPrev || 5) * 450),
      evidence: [hasQr ? 'QR Code' : 'QR Auto', 'Sensor IoT', 'GPS Motorista'],
    };

    const updatedStops = route.stops.map((s, idx) => idx === i ? { ...s, done: true } : s);
    const allDone = updatedStops.every(s => s.done);

    updateContainer(liveContainer.id, { fillLevel: after, lastCollectionAt: nowIso() });
    setData(d => ({
      ...d,
      collections: [collection, ...d.collections],
      routes: d.routes.map(r => r.id === route.id ? { ...r, stops: updatedStops, status: allDone ? 'completed' : 'approved' } : r),
      vehicles: allDone ? d.vehicles.map(v => v.id === route.vehicleId ? { ...v, status: 'available' } : v) : d.vehicles,
    }));
    logAction('RECOLHA_AUDITADA', `${liveContainer.code} (${before}%→${after}%) → Mulenvos`);
    toast(`Recolha auditada: ${liveContainer.code} (${before}% → ${after}%)`, 'success');
  };

  const reportIssue = (i) => {
    const stop = route.stops[i];
    if (!stop) return;
    addAlert({
      type: 'occurrence', containerId: stop.code, containerCode: stop.code,
      message: `Ocorrência reportada pelo motorista em ${stop.code} (${stop.street})`,
      severity: 'high', read: false
    });
    logAction('OCORRENCIA_MOTORISTA', stop.code);
    toast(`Ocorrência enviada à central (${stop.code})`, 'warn');
  };

  const pendingStops = route.stops.filter(s => !s.done);
  const doneCount = route.stops.filter(s => s.done).length;

  return (
    <div className="max-w-2xl mx-auto space-y-4 tabular-nums">
      <Card className="p-4 samakaka-bg text-white flex flex-wrap items-center justify-between gap-3 border-0">
        <div>
          <p className="text-xs text-ochre-400 font-bold uppercase">Terminal Operador · {route.id}</p>
          <h3 className="text-lg font-extrabold">{route.vehiclePlate} · {assignedVehicle?.type}</h3>
          <p className="text-xs text-stone-300">{doneCount}/{route.stops.length} paragens auditadas · {route.totalKm} km · Destino: Aterro dos Mulenvos</p>
        </div>
        {pendingStops.length > 0 && (
          <a href={buildGoogleMapsDirectionsUrl(pendingStops, assignedVehicle)} target="_blank" rel="noopener noreferrer"
            className="px-3.5 py-2 rounded-lg text-xs font-bold bg-ochre-500 hover:bg-ochre-600 text-white inline-flex items-center gap-1.5 shadow">
            <Icon name="compass" className="w-4 h-4" />
            <span>Navegar Rota</span>
          </a>
        )}
      </Card>

      <div className="space-y-2.5">
        {route.stops.map((s, i) => {
          const qrOk = !!qrValidatedMap[s.id];
          return (
            <Card key={s.id + '-' + i} className={`p-4 flex flex-wrap items-center justify-between gap-3 ${s.done ? 'opacity-65 bg-teal-50/40' : ''}`}>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-extrabold text-obsidian-900">{i + 1}. {s.code}</span>
                  <span className="text-xs font-bold text-terra-600">{s.fillLevel}%</span>
                  {qrOk && !s.done && <span className="text-[11px] font-bold bg-teal-100 text-teal-900 px-2 py-0.5 rounded-full">QR Validado</span>}
                  {s.done && <span className="text-xs font-bold text-savanna-600">✓ Recolha Auditada</span>}
                </div>
                <p className="text-xs font-semibold text-obsidian-800 mt-0.5">{s.street}</p>
                <p className="text-[11px] text-stone-500">{s.municipality}, {s.province}</p>
              </div>
              {!s.done && (
                <div className="flex flex-wrap gap-2">
                  <Btn variant={qrOk ? 'ghost' : 'dark'} className="!text-xs" onClick={() => scanQrCode(s.id, s.code)}>
                    <Icon name="qr" className="w-3.5 h-3.5" />
                    <span>{qrOk ? 'QR Lido' : 'Ler QR Code'}</span>
                  </Btn>
                  <Btn variant="ghost" className="!text-xs" onClick={() => reportIssue(i)}>Ocorrência</Btn>
                  <Btn variant="savanna" className="!text-xs" onClick={() => finishStop(i)}>Confirmar Recolha</Btn>
                </div>
              )}
            </Card>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================================
 * 12. MÓDULO 5 — CONTENTORES (INVENTÁRIO, FICHA TÉCNICA & QR CODE)
 * ========================================================================== */

function ContainersModule({ data, setData, logAction, openDetail, openCreate }) {
  const toast = useToast();
  const [q, setQ] = useState('');
  const [prov, setProv] = useState('all');
  const thresholds = { critical: data.settings?.criticalThreshold || 90, full: data.settings?.fullThreshold || 75 };

  const filtered = useMemo(() => {
    return data.containers.filter(c => {
      if (prov !== 'all' && c.province !== prov) return false;
      if (q.trim()) {
        const s = q.toLowerCase();
        return c.code.toLowerCase().includes(s) || c.street.toLowerCase().includes(s) || c.municipality.toLowerCase().includes(s);
      }
      return true;
    });
  }, [data.containers, prov, q]);

  const removeContainer = (c) => {
    setData(d => ({
      ...d,
      containers: d.containers.filter(x => x.id !== c.id),
      sensors: d.sensors.filter(s => s.containerId !== c.id),
    }));
    logAction('REMOVER_CONTENTOR', c.code);
    toast(`Contentor ${c.code} removido`, 'info');
  };

  return (
    <div className="space-y-4">
      <Card className="p-4 flex flex-wrap items-center justify-between gap-3">
        <div className="flex flex-wrap items-center gap-2 flex-1 min-w-[240px]">
          <Input value={q} onChange={e => setQ(e.target.value)} placeholder="Pesquisar código, rua ou município..." className="max-w-xs" />
          <Select value={prov} onChange={e => setProv(e.target.value)} className="max-w-[180px]">
            <option value="all">Todas Províncias</option>
            {[...new Set(data.containers.map(c => c.province))].map(p => <option key={p}>{p}</option>)}
          </Select>
        </div>
        <Btn variant="primary" onClick={openCreate}>
          <Icon name="plus" className="w-4 h-4" />
          <span>Novo Contentor</span>
        </Btn>
      </Card>

      <Card className="p-4 overflow-auto">
        <table className="w-full text-sm tabular-nums">
          <thead className="bg-obsidian-900 text-sand-50">
            <tr>
              {['Código', 'Localização Oficial', 'Enchimento', 'Estado', 'Conservação', 'Sensor', 'Acções'].map(h =>
                <th key={h} className="text-left px-3 py-2.5 font-semibold">{h}</th>)}
            </tr>
          </thead>
          <tbody className="divide-y divide-sand-100">
            {filtered.map(c => {
              const st = statusKey(c, data.sensors, thresholds);
              return (
                <tr key={c.id} className="hover:bg-sand-50 transition">
                  <td className="px-3 py-2.5 font-extrabold text-obsidian-900">{c.code}</td>
                  <td className="px-3 py-2.5">
                    <p className="font-semibold text-obsidian-900">{c.street}</p>
                    <p className="text-xs text-stone-500">{c.neighborhood} · {c.municipality}, {c.province}</p>
                  </td>
                  <td className="px-3 py-2.5">
                    <div className="flex items-center gap-2">
                      <div className="w-20 bg-sand-100 rounded-full h-2 overflow-hidden">
                        <div className="h-2" style={{ width: c.fillLevel + '%', backgroundColor: STATUS[st].color }} />
                      </div>
                      <span className="font-bold text-xs">{c.fillLevel}%</span>
                    </div>
                  </td>
                  <td className="px-3 py-2.5"><Badge status={st} /></td>
                  <td className="px-3 py-2.5 text-xs">{c.conservation}</td>
                  <td className="px-3 py-2.5 font-mono text-xs">{c.sensorId}</td>
                  <td className="px-3 py-2.5 whitespace-nowrap space-x-1.5">
                    <Btn variant="dark" className="!px-2.5 !py-1 !text-xs" onClick={() => openDetail(c.id)}>Ficha &amp; QR</Btn>
                    <Btn variant="ghost" className="!px-2 !py-1 !text-xs text-terra-600" onClick={() => removeContainer(c)}>Eliminar</Btn>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Card>
    </div>
  );
}

function ContainerDetailModal({ data, containerId, onClose }) {
  const qrRef = useRef(null);
  const c = data.containers.find(x => x.id === containerId || x.code === containerId);
  const s = c ? data.sensors.find(x => x.id === c.sensorId) : null;

  useEffect(() => {
    if (qrRef.current && c) {
      qrRef.current.innerHTML = '';
      try {
        if (typeof QRCode !== 'undefined') {
          new QRCode(qrRef.current, {
            text: `KIELA-AO:${c.code}|${c.province}|${c.municipality}|${c.lat},${c.lng}`,
            width: 110,
            height: 110,
          });
        }
      } catch (e) {}
    }
  }, [c]);

  if (!c) return null;
  const st = statusKey(c, data.sensors);
  const trendData = [
    { h: '06h', lvl: Math.max(8, c.fillLevel - 28) },
    { h: '09h', lvl: Math.max(12, c.fillLevel - 19) },
    { h: '12h', lvl: Math.max(18, c.fillLevel - 11) },
    { h: '15h', lvl: Math.max(22, c.fillLevel - 5) },
    { h: 'Agora', lvl: c.fillLevel },

/* ============================================================================
 * 13. MÓDULO 6 — SENSORES IOT (ULTRASSÓNICO, TÉRMICO, ANTI-FURTO & LORAWAN)
 * ========================================================================== */

function SensorsModule({ data, updateContainer, updateSensor, addAlert, logAction }) {
  const toast = useToast();
  const [selectedSensorId, setSelectedSensorId] = useState(data.sensors[0]?.id || 'SN-0001');
  const sensor = data.sensors.find(s => s.id === selectedSensorId) || data.sensors[0];
  const container = sensor ? data.containers.find(c => c.id === sensor.containerId) : null;
  const [simLevel, setSimLevel] = useState(container?.fillLevel ?? 50);
  const [simTemp, setSimTemp] = useState(sensor?.temperatureC ?? 32);

  useEffect(() => {
    if (container) setSimLevel(container.fillLevel);
    if (sensor) setSimTemp(sensor.temperatureC ?? 32);
  }, [selectedSensorId]);

  const sendTelemetry = () => {
    if (!sensor || !container) return;
    updateContainer(container.id, { fillLevel: simLevel });
    updateSensor(sensor.id, {
      lastReadingLevel: simLevel,
      temperatureC: simTemp,
      lastReadingAt: nowIso(),
      connectivity: 'online',
      bufferedPackets: 0,
    });
    logAction('TELEMETRIA_IOT', `${sensor.id} (${container.code}) → ${simLevel}%, ${simTemp}°C`);

    if (simTemp >= 45) {
      addAlert({
        type: 'fire', containerId: container.code, containerCode: container.code,
        message: `ALERTA TÉRMICO (${simTemp}°C): Risco de fogo em ${container.code} (${container.street})`,
        severity: 'high', read: false
      });
      toast(`Alerta de incêndio (${simTemp}°C) em ${container.code}!`, 'error');
    } else if (simLevel >= 90) {
      addAlert({
        type: 'critical', containerId: container.code, containerCode: container.code,
        message: `${container.code} (${container.street}) crítico (${simLevel}%)`, severity: 'high', read: false
      });
      toast(`Alerta crítico gerado: ${container.code} (${simLevel}%)`, 'error');
    } else {
      toast(`Leitura LoRaWAN sincronizada: ${container.code} (${simLevel}% · ${simTemp}°C)`, 'success');
    }
  };

  const toggleTiltAlert = (s) => {
    const c = data.containers.find(x => x.id === s.containerId);
    const nextTilt = s.tiltStatus === 'Estável' ? 'Tombamento / Anti-Furto' : 'Estável';
    updateSensor(s.id, { tiltStatus: nextTilt });
    if (nextTilt !== 'Estável' && c) {
      addAlert({
        type: 'theft', containerId: c.code, containerCode: c.code,
        message: `Acelerómetro Anti-Furto: Movimentação anómala em ${c.code} (${c.street})`,
        severity: 'high', read: false
      });
      toast(`Alerta anti-furto disparado em ${c.code}`, 'error');
    } else {
      toast(`Acelerómetro ${s.id} normalizado`, 'info');
    }
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <Card className="p-4 space-y-3">
        <h3 className="font-bold text-obsidian-900">Emulador Multissensor LoRaWAN</h3>
        <Field label="Seleccionar Nó IoT">
          <Select value={selectedSensorId} onChange={e => setSelectedSensorId(e.target.value)}>
            {data.sensors.map(s => {
              const c = data.containers.find(x => x.id === s.containerId);
              return <option key={s.id} value={s.id}>{s.id} — {c?.code} ({c?.street})</option>;
            })}
          </Select>
        </Field>
        <Field label={`Nível Ultrassónico: ${simLevel}%`}>
          <Input type="range" min="0" max="100" value={simLevel} onChange={e => setSimLevel(Number(e.target.value))} />
        </Field>
        <Field label={`Sensor Térmico (Alerta Fogo): ${simTemp}°C`}>
          <Input type="range" min="20" max="75" value={simTemp} onChange={e => setSimTemp(Number(e.target.value))} />
        </Field>
        <div className="flex gap-2">
          <Btn variant="ghost" className="flex-1 !text-xs" onClick={() => { setSimLevel(25); setSimTemp(30); }}>Normal</Btn>
          <Btn variant="primary" className="flex-1 !text-xs" onClick={() => { setSimLevel(94); setSimTemp(34); }}>Crítico 94%</Btn>
          <Btn variant="danger" className="flex-1 !text-xs" onClick={() => { setSimLevel(82); setSimTemp(56); }}>Fogo 56°C</Btn>
        </div>
        <Btn variant="savanna" className="w-full" onClick={sendTelemetry}>Transmitir Pacote LoRaWAN</Btn>
      </Card>

      <Card className="p-4 lg:col-span-2 overflow-auto">
        <h3 className="font-bold text-obsidian-900 mb-3">Rede de Sensores Encapsulados ({data.sensors.length})</h3>
        <table className="w-full text-sm tabular-nums">
          <thead className="bg-obsidian-900 text-sand-50">
            <tr>
              {['Sensor', 'Contentor / Via', 'Nível', 'Temp.', 'Inclinação', 'LoRaWAN / Buffer', 'Acção'].map(h =>
                <th key={h} className="text-left px-3 py-2 font-semibold">{h}</th>)}
            </tr>
          </thead>
          <tbody className="divide-y divide-sand-100">
            {data.sensors.map(s => {
              const c = data.containers.find(x => x.id === s.containerId);
              return (
                <tr key={s.id} className="hover:bg-sand-50">
                  <td className="px-3 py-2 font-mono font-bold text-xs">{s.id}</td>
                  <td className="px-3 py-2 text-xs"><b>{c?.code}</b> · {c?.street}</td>
                  <td className="px-3 py-2 font-bold">{s.lastReadingLevel}%</td>
                  <td className={`px-3 py-2 text-xs font-bold ${s.temperatureC >= 40 ? 'text-terra-600' : 'text-obsidian-800'}`}>{s.temperatureC}°C</td>
                  <td className="px-3 py-2 text-xs">{s.tiltStatus}</td>
                  <td className="px-3 py-2">
                    <span className={`px-2 py-0.5 rounded-full text-[11px] font-semibold ${s.connectivity === 'online' ? 'bg-teal-100 text-teal-900' : 'bg-amber-100 text-amber-900'}`}>
                      {s.connectivity === 'online' ? 'Online' : `Store-Forward (${s.bufferedPackets})`}
                    </span>
                  </td>
                  <td className="px-3 py-2">
                    <Btn variant="ghost" className="!px-2 !py-1 !text-xs" onClick={() => toggleTiltAlert(s)}>
                      {s.tiltStatus === 'Estável' ? 'Testar Anti-Furto' : 'Normalizar'}
                    </Btn>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Card>
    </div>
  );
}

/* ============================================================================
 * 16. MÓDULO 9 — PORTAL DO CIDADÃO (OCORRÊNCIAS COM FOTO & LOCALIZAÇÃO)
 * ========================================================================== */

function CitizenModule({ data, setData, updateContainer, addAlert, logAction }) {
  const toast = useToast();
  const [form, setForm] = useState({
    containerCode: data.containers[0]?.code || 'KL-0001',
    category: 'Transbordo de resíduos',
    description: '',
    photoTag: 'Foto_Via_Publica_AO.jpg',
    reporter: '',
  });

  const submitReport = () => {
    const target = data.containers.find(c => c.code === form.containerCode);
    const rep = {
      id: 'CID-' + String((data.citizenReports?.length || 0) + 1).padStart(3, '0'),
      containerCode: form.containerCode,
      province: target?.province || 'Luanda',
      location: target ? `${target.municipality} — ${target.street}` : form.containerCode,
      category: form.category,
      description: form.description.trim() || 'Reporte registado pelo canal cidadão Kiela.',
      photoTag: form.photoTag || 'Evidência Fotográfica Georreferenciada',
      reporter: form.reporter.trim() || 'Munícipe (+244)',
      timestamp: nowIso(),
      status: 'pending',
    };
    setData(d => ({ ...d, citizenReports: [rep, ...(d.citizenReports || [])] }));
    logAction('REPORTE_CIDADAO', `${rep.id} (${rep.containerCode})`);
    toast(`Ocorrência ${rep.id} registada com evidência fotográfica`, 'success');
    setForm(f => ({ ...f, description: '' }));
  };

  const triageReport = (rep, nextStatus) => {
    setData(d => ({
      ...d,
      citizenReports: (d.citizenReports || []).map(r => r.id === rep.id ? { ...r, status: nextStatus } : r),
    }));
    if (nextStatus === 'dispatched') {
      const target = data.containers.find(c => c.code === rep.containerCode);
      if (target && target.fillLevel < 85) updateContainer(target.id, { fillLevel: 91 });
      addAlert({
        type: 'full', containerId: rep.containerCode, containerCode: rep.containerCode,
        message: `Prioridade Cidadã (${rep.id}): ${rep.location}`, severity: 'high', read: false
      });
    }
    logAction('TRIAGEM_CIDADAO', `${rep.id} → ${nextStatus}`);
    toast(`Ticket ${rep.id} actualizado`, 'info');
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <Card className="p-4 space-y-3">
        <h3 className="font-bold text-obsidian-900">Canal Cidadão Georreferenciado</h3>
        <Field label="Contentor / Via Próxima">
          <Select value={form.containerCode} onChange={e => setForm({ ...form, containerCode: e.target.value })}>
            {data.containers.map(c => <option key={c.id} value={c.code}>{c.code} — {c.street} ({c.municipality})</option>)}
          </Select>
        </Field>
        <Field label="Tipo de Ocorrência">
          <Select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}>
            <option>Transbordo de resíduos</option>
            <option>Fumo / risco de incêndio</option>
            <option>Depósito ilegal na via pública</option>
            <option>Contentor danificado / vandalizado</option>
          </Select>
        </Field>
        <Field label="Evidência Fotográfica">
          <div className="flex items-center gap-2 border border-sand-200 rounded-lg px-3 py-2 bg-sand-50 text-xs">
            <Icon name="camera" className="w-4 h-4 text-ochre-600" />
            <input value={form.photoTag} onChange={e => setForm({ ...form, photoTag: e.target.value })} className="bg-transparent flex-1 focus:outline-none" />
          </div>
        </Field>
        <Field label="Descrição">
          <Input value={form.description} onChange={e => setForm({ ...form, description: e.target.value })} placeholder="Detalhes do ponto..." />
        </Field>
        <Field label="Telemóvel do Munícipe">
          <Input value={form.reporter} onChange={e => setForm({ ...form, reporter: e.target.value })} placeholder="+244 923 000 000" />
        </Field>
        <Btn variant="savanna" className="w-full" onClick={submitReport}>Enviar Ocorrência</Btn>
      </Card>

      <Card className="p-4 lg:col-span-2 space-y-2.5">
        <h3 className="font-bold text-obsidian-900">Tickets &amp; Triagem Operacional ({(data.citizenReports || []).length})</h3>
        <div className="divide-y divide-sand-100">
          {(data.citizenReports || []).map(r => {
            const st = CITIZEN_STATUS[r.status] || CITIZEN_STATUS.pending;
            return (
              <div key={r.id} className="py-3 flex flex-wrap items-center justify-between gap-3">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-xs text-obsidian-900">{r.id} · {r.containerCode}</span>
                    <span className={`px-2 py-0.5 rounded-full text-[11px] font-semibold ${st.bg} ${st.text}`}>{st.label}</span>
                  </div>
                  <p className="text-xs font-bold text-obsidian-800 mt-0.5">{r.category} — {r.location}</p>
                  <p className="text-xs text-stone-500">{r.description} · <span className="text-ochre-600 font-medium">{r.photoTag}</span></p>
                </div>
                <div className="flex gap-1.5">
                  {r.status === 'pending' && (
                    <Btn variant="primary" className="!px-2.5 !py-1 !text-xs" onClick={() => triageReport(r, 'dispatched')}>Priorizar Rota</Btn>
                  )}
                  {r.status !== 'resolved' && (
                    <Btn variant="savanna" className="!px-2.5 !py-1 !text-xs" onClick={() => triageReport(r, 'resolved')}>Resolver</Btn>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

const ECO_MATERIAL_RATES = {

];

function computePseudoSha256(seedStr) {
  let h1 = 0x811c9dc5;
  let h2 = 0x1b873593;
  for (let i = 0; i < seedStr.length; i++) {
    const ch = seedStr.charCodeAt(i);
    h1 ^= ch;
    h1 = Math.imul(h1, 0x01000193);
    h2 ^= (ch + i * 17);
    h2 = Math.imul(h2, 0x85ebca6b);
  }
  const partA = (h1 >>> 0).toString(16).padStart(8, '0');
  const partB = (h2 >>> 0).toString(16).padStart(8, '0');
  const partC = ((h1 ^ h2) >>> 0).toString(16).padStart(8, '0');
  const partD = ((h1 + h2) >>> 0).toString(16).padStart(8, '0');
  return (partA + partB + partC + partD + partA + partB + partC + partD).toUpperCase();
}

    ).join('\n');
    const blob = new Blob([header + rows], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);

    a.href = url;
    a.download = `kiela_relatorio_angola_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();

    toast('Relatório CSV Kiela exportado', 'success');

        <div className="overflow-auto">
          <table className="w-full text-sm">
            <thead className="bg-obsidian-900 text-sand-50">
              <tr>
                {['Nome', 'Email', 'Perfil', 'Organização', 'Sessão'].map(h =>
                  <th key={h} className="text-left px-3 py-2.5 font-semibold">{h}</th>)}
              </tr>
            </thead>
            <tbody className="divide-y divide-sand-100">
              {data.users.map(u => (
                <tr key={u.id}>
                  <td className="px-3 py-2 font-semibold">{u.name}</td>
                  <td className="px-3 py-2 text-xs">{u.email}</td>
                  <td className="px-3 py-2">
                    <Select value={u.role} onChange={e => {
                      const newRole = e.target.value;
                      setData(d => ({
                        ...d,
                        users: d.users.map(x => x.id === u.id ? { ...x, role: newRole } : x),
                        currentUser: d.currentUser?.id === u.id ? { ...d.currentUser, role: newRole } : d.currentUser
                      }));
                      logAction('PERFIL', `${u.name} → ${newRole}`);
                    }} className="!py-1 !text-xs">
                      {roles.map(r => <option key={r}>{r}</option>)}
                    </Select>
                  </td>
                  <td className="px-3 py-2">{u.org}</td>
                  <td className="px-3 py-2">
                    <Btn variant="ghost" className="!px-2.5 !py-1 !text-xs" onClick={() => onSwitchUser(u.email)}>Alternar Perfil</Btn>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

/* ============================================================================
 * 20. ORQUESTRADOR PRINCIPAL KIELA
 * ========================================================================== */

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) {
      return (
        <div style={{ padding: 24 }}>
          <div style={{ background: '#fef2f2', border: '2px solid #c2410c', borderRadius: 12, padding: 20 }}>
            <h2 style={{ color: '#7f1d1d', margin: '0 0 8px' }}>Erro na aplicação</h2>
            <p>{String(this.state.err.message || this.state.err)}</p>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function AppInner() {
  const toast = useToast();
  const [data, setData] = useState(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && parsed.containers && parsed.currentUser) return parsed;
      }
    } catch (e) {}
    return buildSeed();
  });

  const [page, setPage] = useState('dashboard');
  const [detailId, setDetailId] = useState(null);
  const [createOpen, setCreateOpen] = useState(false);
  const [mobileNav, setMobileNav] = useState(false);
  const [globalQuery, setGlobalQuery] = useState('');

  useEffect(() => { document.getElementById('root').dataset.mounted = '1'; }, []);

  useEffect(() => {
    const t = setTimeout(() => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    }, 300);
    return () => clearTimeout(t);
  }, [data]);

  const logAction = useCallback((action, detail) => setData(d => ({
    ...d, auditLog: [{ id: uid('LOG'), timestamp: nowIso(), user: d.currentUser?.name || 'sistema', action, detail }, ...d.auditLog].slice(0, 100)
  })), []);

  const updateContainer = useCallback((id, patch) => setData(d => ({ ...d, containers: d.containers.map(c => c.id === id ? { ...c, ...patch } : c) })), []);
  const updateSensor    = useCallback((id, patch) => setData(d => ({ ...d, sensors: d.sensors.map(s => s.id === id ? { ...s, ...patch } : s) })), []);
  const addAlert        = useCallback((a) => setData(d => ({ ...d, alerts: [{ ...a, id: uid('AL'), timestamp: nowIso() }, ...d.alerts].slice(0, 60) })), []);

  const allowedNav = useMemo(() => {
    const role = data.currentUser?.role || 'admin';
    const allowedPerms = PERMS[role] || PERMS.admin;
    return ALL_NAV.filter(n => allowedPerms.includes(n.perm));
  }, [data.currentUser?.role]);

  const navSections = useMemo(() => {
    const groups = {};
    allowedNav.forEach(item => {
      if (!groups[item.section]) groups[item.section] = [];
      groups[item.section].push(item);
    });
    return Object.entries(groups);
  }, [allowedNav]);

  const globalHits = useMemo(() => {
    const q = globalQuery.trim().toLowerCase();
    if (!q) return [];
    const hits = [];
    data.containers.forEach(c => {
      if (c.code.toLowerCase().includes(q) || c.street.toLowerCase().includes(q) || c.municipality.toLowerCase().includes(q)) {
        hits.push({ kind: 'Contentor', title: `${c.code} · ${c.street}`, sub: `${c.municipality} (${c.fillLevel}%)`, action: () => { setDetailId(c.id); setGlobalQuery(''); } });
      }
    });
    data.vehicles.forEach(v => {
      if (v.plate.toLowerCase().includes(q) || v.type.toLowerCase().includes(q)) {
        hits.push({ kind: 'Viatura', title: v.plate, sub: v.type, action: () => { setPage('vehicles'); setGlobalQuery(''); } });
      }
    });
    return hits.slice(0, 6);
  }, [globalQuery, data.containers, data.vehicles]);

  useEffect(() => {
    if (!data.currentUser) return;
    if (!allowedNav.some(n => n.id === page)) {
      setPage(allowedNav[0]?.id || 'dashboard');
    }
  }, [allowedNav, page, data.currentUser]);

  const login = (email) => {
    const u = data.users.find(x => x.email === email) || data.users[0];
    setData(d => ({ ...d, currentUser: u }));
    const firstPage = ALL_NAV.find(n => (PERMS[u.role] || PERMS.admin).includes(n.perm))?.id || 'dashboard';
    setPage(firstPage);
    logAction('LOGIN', `${u.name} (${u.role})`);
    toast(`Bem-vindo ao Kiela, ${u.name}`, 'success');
  };

  const logout = () => {
    setData(d => ({ ...d, currentUser: null }));
    toast('Sessão encerrada', 'info');
  };

  const createContainer = (form) => {
    const n = data.containers.length + 1;
    const code = 'KL-' + String(n).padStart(4, '0');
    const sensorId = 'SN-' + String(n).padStart(4, '0');
    const c = { id: code, code, ...form, sensorId, lastCollectionAt: nowIso() };
    const s = {
      id: sensorId, containerId: code, battery: 100, connectivity: 'online', status: 'ok',
      temperatureC: 30, tiltStatus: 'Estável', bufferedPackets: 0,
      lastReadingAt: nowIso(), lastReadingLevel: form.fillLevel
    };
    setData(d => ({ ...d, containers: [c, ...d.containers], sensors: [s, ...d.sensors] }));
    logAction('CRIAR_CONTENTOR', code);
    setCreateOpen(false);
  };

  const resetDemo = () => {
    const fresh = buildSeed();
    fresh.currentUser = data.currentUser;
    setData(fresh);
    setPage('dashboard');
    toast('Cenário Kiela Angola restaurado', 'info');
  };

  if (!data.currentUser) return <LoginScreen onLogin={login} />;

  const titles = Object.fromEntries(ALL_NAV.map(n => [n.id, n.label]));
  const unreadAlerts = data.alerts.filter(a => !a.read).length;

  return (
    <div className="min-h-screen flex bg-sand-50">
      <aside className={`${mobileNav ? 'block' : 'hidden'} md:block fixed md:static inset-y-0 left-0 z-40 w-64 samakaka-bg text-sand-50 flex-shrink-0 overflow-y-auto flex flex-col border-r border-obsidian-800`}>
        <div className="afro-ribbon" />
        <div className="p-4 border-b border-white/10 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <KielaLogo size={38} />
            <div>
              <p className="font-extrabold text-lg leading-none tracking-tight text-white">Kiela</p>
              <p className="text-[10px] text-ochre-400 font-bold uppercase tracking-wider mt-1">Economia Circular</p>
            </div>
          </div>
          <button className="md:hidden text-white/70" onClick={() => setMobileNav(false)}>
            <Icon name="close" className="w-5 h-5" />
          </button>
        </div>

        <nav className="p-3 space-y-4 flex-1">
          {navSections.map(([sectionTitle, items]) => (
            <div key={sectionTitle}>
              <p className="px-3 mb-1.5 text-[10px] font-bold uppercase tracking-wider text-ochre-400/75">{sectionTitle}</p>
              <div className="space-y-0.5">
                {items.map(n => (
                  <button key={n.id} onClick={() => { setPage(n.id); setMobileNav(false); }}
                    className={`w-full text-left px-3 py-2 rounded-lg text-sm flex items-center gap-2.5 transition ${
                      page === n.id
                        ? 'bg-ochre-500 text-white font-bold shadow-sm'
                        : 'hover:bg-white/10 text-stone-300'
                    }`}>
                    <Icon name={n.icon} className="w-4 h-4" />
                    <span className="truncate">{n.label}</span>
                  </button>
                ))}
              </div>
            </div>
          ))}
        </nav>

        <div className="p-3.5 border-t border-white/10 text-xs text-stone-300 bg-obsidian-950/60">
          <p className="font-bold text-white">{data.currentUser.name}</p>
          <p className="capitalize text-ochre-400 font-semibold">{data.currentUser.role} · {data.currentUser.org}</p>
          <button onClick={logout} className="mt-2 text-stone-400 hover:text-white underline">Terminar sessão</button>
        </div>
      </aside>

      <div className="flex-1 min-w-0 flex flex-col">
        <div className="afro-ribbon no-print" />
        <header className="bg-white border-b border-sand-200 px-4 py-2.5 flex items-center gap-3 no-print sticky top-0 z-30">
          <button className="md:hidden text-obsidian-900" onClick={() => setMobileNav(v => !v)}>
            <Icon name="menu" className="w-5 h-5" />
          </button>
          <div className="min-w-0">
            <h1 className="font-extrabold text-obsidian-900 text-base truncate">{titles[page]}</h1>
            <p className="text-[11px] text-stone-500 hidden sm:block">Kiela · Inteligência Urbana &amp; Economia Circular (Angola)</p>
          </div>

          <div className="relative flex-1 max-w-sm ml-2 hidden md:block">
            <div className="relative">
              <span className="absolute left-2.5 top-2 text-stone-400">
                <Icon name="search" className="w-4 h-4" />
              </span>
              <input
                value={globalQuery}
                onChange={e => setGlobalQuery(e.target.value)}
                placeholder="Pesquisar contentor, Rua Dr. Agostinho Neto - Viana ou matrícula..."
                className="w-full pl-8 pr-3 py-1.5 text-xs bg-sand-100 border border-sand-200 rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-ochre-500/30"
              />
            </div>
            {globalHits.length > 0 && (
              <div className="absolute left-0 right-0 mt-1 bg-white border border-sand-200 rounded-xl shadow-xl z-50 divide-y divide-sand-100 overflow-hidden">
                {globalHits.map((h, i) => (
                  <button key={i} type="button" onClick={h.action} className="w-full text-left px-3 py-2 hover:bg-sand-50 transition">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-obsidian-900">{h.title}</span>
                      <span className="text-[10px] font-bold uppercase text-savanna-600">{h.kind}</span>
                    </div>
                    <p className="text-[11px] text-stone-500">{h.sub}</p>
                  </button>
                ))}
              </div>
            )}
          </div>

          <div className="ml-auto flex items-center gap-2">
            <button onClick={() => setPage('dashboard')} title="Alertas activos"
              className="relative px-2.5 py-1.5 rounded-lg border border-sand-200 hover:bg-sand-100 text-obsidian-900">
              <Icon name="bell" className="w-4 h-4" />
              {unreadAlerts > 0 && (
                <span className="absolute -top-1.5 -right-1.5 bg-terra-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center tabular-nums">
                  {unreadAlerts}
                </span>
              )}
            </button>

            <Btn variant="ghost" onClick={resetDemo}>
              <Icon name="refresh" className="w-3.5 h-3.5" />
              <span className="hidden sm:inline">Repor Demo</span>
            </Btn>
          </div>
        </header>

        <main className="p-4 flex-1">
          {page === 'dashboard' && <Dashboard data={data} setData={setData} logAction={logAction} go={setPage}
            onMarkAllAlertsRead={() => setData(d => ({ ...d, alerts: d.alerts.map(a => ({ ...a, read: true })) }))}
            onInspectContainer={(code) => setDetailId(code)} />}
          {page === 'map' && <MapModule data={data} selectContainer={(id) => setDetailId(id)} />}
          {page === 'containers' && <ContainersModule data={data} setData={setData} logAction={logAction}
            openDetail={setDetailId} openCreate={() => setCreateOpen(true)} />}
          {page === 'sensors' && <SensorsModule data={data} updateContainer={updateContainer} updateSensor={updateSensor}
            addAlert={addAlert} logAction={logAction} />}
          {page === 'vehicles' && <VehiclesModule data={data} setData={setData} logAction={logAction} />}
          {page === 'routes' && <RoutesModule data={data} setData={setData} logAction={logAction} />}
          {page === 'driver' && <DriverModule data={data} setData={setData} updateContainer={updateContainer}
            addAlert={addAlert} logAction={logAction} />}
          {page === 'collections' && <CollectionsModule data={data} />}
          {page === 'citizen' && <CitizenModule data={data} setData={setData} updateContainer={updateContainer}
            addAlert={addAlert} logAction={logAction} />}
          {page === 'esg' && <EsgModule data={data} setData={setData} logAction={logAction} />}
          {page === 'reports' && <ReportsModule data={data} />}
          {page === 'admin' && <AdminModule data={data} setData={setData} logAction={logAction} onSwitchUser={login} />}
        </main>
      </div>

      {detailId && <ContainerDetailModal data={data} containerId={detailId} onClose={() => setDetailId(null)} />}
      <ContainerFormModal open={createOpen} onClose={() => setCreateOpen(false)} onCreate={createContainer}
        nextCode={'KL-' + String(data.containers.length + 1).padStart(4, '0')} />
    </div>
  );
}

function App() {
  return (
    <ErrorBoundary>
      <ToastProvider>
        <AppInner />
      </ToastProvider>
    </ErrorBoundary>
  );
}

const rootEl = document.getElementById('root');
const root = ReactDOM.createRoot ? ReactDOM.createRoot(rootEl) : { render: (el) => ReactDOM.render(el, rootEl) };
root.render(React.createElement(App));
</script>
</body>
